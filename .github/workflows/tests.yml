name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # Only the pure-function tests run here. The retrieval eval needs a
        # populated Qdrant collection and the agent needs a running Ollama
        # instance, neither of which exist on a CI runner.
        run: python -m pytest tests/ -v